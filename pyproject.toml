[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyfederation"
version = "2.2.1"
description = "Python client for Open Federated Database (OFD) servers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]
keywords = ["ofd", "federation", "spam", "moderation", "client"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/nosial/PyFederation"
Source = "https://github.com/nosial/PyFederation"
Issues = "https://github.com/nosial/PyFederation/issues"
Changelog = "https://github.com/nosial/PyFederation/blob/master/CHANGELOG.md"
Specification = "https://github.com/nosial/OFD-Specification"

[dependency-groups]
dev = [
    "anyio>=4",
    "mypy>=1.10",
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyfederation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PIE", "RET", "G", "LOG", "PT", "PTH", "FLY",
    "FURB", "RSE", "ERA", "ISC", "T20", "DTZ", "PLE", "PLW", "PLC", "ICN", "YTT", "SLOT",
]

[tool.ruff.lint.per-file-ignores]
# Command-line entry points report to the terminal.
"scripts/unasync.py" = ["T20"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires a running Federation server, see docker-compose.yml"]
